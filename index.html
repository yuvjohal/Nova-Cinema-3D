<style>
:root{
  color-scheme: dark;
  --bg:#0b0808; --panel:#141010; --surface:#1c1515; --line:#33272a;
  --red:#e3262f; --gold:#f2b544; --gold-soft:#f2b5441f; --ok:#6fdb9e;
  --text:#f7f1ec; --muted:#a99c97;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr 360px;height:100%}
.view{position:relative;overflow:hidden;min-width:0;background:radial-gradient(120% 80% at 50% 0%,#1d1011,#0b0808 70%)}
#c{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.lab .box{background:#120d0ee8;border:1px solid #f2b54499;border-radius:9px;padding:5px 9px;white-space:nowrap;box-shadow:0 6px 18px #0009}
.lab.existing .box{border-color:#ffffff33}
.lab b{display:block;font-size:12px;line-height:1.2}
.lab span{display:block;font-size:11px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.lab.existing span{color:var(--muted)}
.lab i{width:1px;height:14px;background:#f2b544aa}
.lab.existing i{background:#ffffff44}
.lab em{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #f2b54433}
.lab.existing em{background:#ddd}
.hud{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.hud h1{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;text-transform:uppercase;letter-spacing:.5px}
.hud h1 span{color:var(--gold)}
.hud p{margin:0;color:var(--muted);font-size:12px}
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;display:flex;gap:14px;font-size:11px;color:var(--muted);background:#0b0808cc;border:1px solid var(--line);border-radius:10px;padding:7px 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{position:absolute;right:16px;bottom:16px;font-size:11px;color:var(--muted)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.nogl b{display:block;color:var(--text);font-family:var(--display);font-size:26px;text-transform:uppercase;margin-bottom:6px}

/* guided tour caption */
.tourcap{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:#120d0ef2;border:1px solid #f2b54466;border-radius:16px;padding:14px 16px 12px;box-shadow:0 14px 40px #000c;display:none}
.tourcap.on{display:block}
.tourcap .k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.tourcap h2{margin:2px 0 4px;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.tourcap p{margin:0;font-size:14px;color:#eadfda}
.tourcap .bar{height:3px;background:#ffffff14;border-radius:3px;margin-top:12px;overflow:hidden}
.tourcap .bar i{display:block;height:100%;width:0;background:var(--gold)}
.tourcap .ctl{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.tourcap .ctl button{background:#ffffff10;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.tourcap .ctl button.pri{background:var(--red);border-color:var(--red);color:#fff}
body.touring .legend,body.touring .hint{display:none}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 24px;display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600}
.tourbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--red);border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;color:#fff;flex:1}
.ptop,.frow{display:flex;gap:8px;align-items:stretch}
.pbtn{width:48px;flex:none;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0}
.pbtn svg{width:20px;height:20px}
.float{position:absolute;top:16px;right:16px;display:none;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 32px)}
.float .cams{justify-content:flex-end}
.float .cams button{background:#141010e6}
body.closed .app{grid-template-columns:1fr}
body.closed .panel{display:none}
body.closed .float{display:flex}
@media (max-width:860px){body.closed .app{grid-template-rows:100vh}body.closed .view{height:100vh}}
.tourbtn svg{width:16px;height:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-weight:700;font-size:13px}
.tabs button small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.tabs button.on{border-color:var(--red);background:#e3262f1f}
.cams{display:flex;gap:6px;flex-wrap:wrap}
.cams button,.tog button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}
.cams button.on{border-color:var(--gold);color:var(--gold)}
.tog{display:flex;gap:6px;flex-wrap:wrap}
.tog button.on{background:var(--gold-soft);border-color:#f2b54477;color:var(--gold)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;align-items:center;border-bottom:1px solid var(--line);background:var(--surface)}
.item:last-child{border-bottom:0}
.item b{font-size:13px}
.item .c{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item small{color:var(--muted);font-size:11px;grid-column:1/3;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:999px;background:#3cc47c22;color:var(--ok);border:1px solid #3cc47c55}
.chip.alt{background:var(--gold-soft);color:var(--gold);border-color:#f2b54455}
.chip.per{background:#ffffff10;color:#d8ccc7;border-color:#ffffff2a}
.econ{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.econ .r{display:flex;justify-content:space-between;gap:10px}
.econ .r span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.econ .r.sub{color:var(--muted);font-size:11px}
.econ .r.sub span{white-space:normal;font-weight:400}
.econ .r.big{border-top:1px solid var(--line);padding-top:7px}
.econ .r.big span:last-child{color:var(--gold)}
.budget{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.budget .r{display:flex;justify-content:space-between;gap:10px}
.budget .r span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.budget .tot{align-items:baseline}
.budget .tot b{font-family:var(--display);font-size:30px;font-weight:800}
.lines{display:flex;flex-direction:column;gap:3px;font-size:12px;margin-top:4px}
.lines .g{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-top:8px}
.lines .r span:first-child{color:#e6dcd7}
.more{background:none;border:0;color:var(--gold);font-weight:600;font-size:12px;padding:0;text-align:left}
.note{font-size:11px;color:var(--muted)}
.msg{background:linear-gradient(135deg,#3a0f13,#1b1112);border:1px solid #4a1d21;border-radius:14px;padding:12px;font-size:13px}
.msg b{color:var(--gold)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100%}
  .view{height:62vh}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hint{display:none}
  .lab b{font-size:11px}.lab span{font-size:10px}
  .tourcap h2{font-size:21px}.tourcap p{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <div class="view" id="view">
    <canvas id="c" aria-label="3D model of Auditorium 2 converted for Nova Social"></canvas>
    <div class="labels" id="labels"></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>Budgeted addition</span><span><i style="background:#8e1a22"></i>Existing seats</span></div>
    <div class="hint">Drag to orbit · scroll to zoom</div>

/* ================= geometry library ================= */
function bentBox(w,h,d,bend,taper){
  const g=new THREE.BoxGeometry(w,h,d,10,6,1), p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i), z=p.getZ(i); const u=x/(w/2), v=y/(h/2);
    if(taper){ const t=Math.max(0,v); x*=1-taper*t*t*t; }
    z-=bend*u*u; p.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals(); return g;
}
function capsule(r,len,seg=10){ // origin at top joint, extends to -len
  const pts=[]; const n=5;
  for(let i=0;i<=n;i++){const a=-Math.PI/2+i/n*Math.PI/2; pts.push(new THREE.Vector2(Math.max(1e-3,r*Math.cos(a)),-len+r+r*Math.sin(a)));}
  for(let i=0;i<=n;i++){const a=i/n*Math.PI/2; pts.push(new THREE.Vector2(Math.max(1e-3,r*Math.cos(a)),-r+r*Math.sin(a)));}
  return new THREE.LatheGeometry(pts,seg);
}

  const g=new THREE.LatheGeometry(prof.map(([x,y])=>new THREE.Vector2(x,y)),16); g.scale(1,1,.66); return g;
}

/* ================= batching: build an Object3D tree, flatten into InstancedMeshes ================= */
function N(parent,geo,mat,{p=[0,0,0],r=[0,0,0],s=[1,1,1],c=null}={}){
  const o=new THREE.Object3D(); o.position.set(...p); o.rotation.set(...r); o.scale.set(...s);
  o.userData={geo,mat,c}; parent.add(o); return o;
}
const J=(parent,p=[0,0,0],r=[0,0,0])=>N(parent,null,null,{p,r});
const Bx=(parent,w,h,d,mat,p,r,c)=>N(parent,'box',mat,{p,r,s:[w,h,d],c});
const Cy=(parent,rad,h,mat,p,r,c,geo='cyl')=>N(parent,geo,mat,{p,r,s:[rad,h,rad],c});
const Sp=(parent,rad,mat,p,c,s)=>N(parent,'sph',mat,{p,s:s||[rad,rad,rad],c});
function matOf(k){return AM[k]||MAT[k];}
function flatten(root){
  root.updateMatrixWorld(true);
  const groups=new Map();
  root.traverse(o=>{const u=o.userData; if(!u||!u.geo) return; const key=u.geo+'|'+u.mat; if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(o);});
  const out=new THREE.Group();
  groups.forEach((list,key)=>{
    const [g,m]=key.split('|');
    const im=new THREE.InstancedMesh(GEO[g],matOf(m),list.length);
    const col=new THREE.Color(), anyC=list.some(o=>o.userData.c!=null);
    list.forEach((o,i)=>{im.setMatrixAt(i,o.matrixWorld); if(anyC){col.setHex(o.userData.c==null?0xffffff:o.userData.c); im.setColorAt(i,col);}});
    im.instanceMatrix.needsUpdate=true; if(im.instanceColor) im.instanceColor.needsUpdate=true;
    out.add(im);
  });
  return out;
}

/* ================= people: simple rounded mannequins, no faces ================= */
const SKIN=[0xe8c3a6,0xc99572,0x9c6a48,0x6e4630,0xf0d2bd];
const SHIRT=[0xc0392b,0xe0a458,0x5d6d7e,0x8e5a9b,0x3f7f6e,0xd35400,0x7f8c8d,0x2e4053,0x2874a6,0xf2f2f2,0x1c1c1c,0x4a6b3a,0xb8860b];
const PANTS=[0x1f2a3a,0x2b2b2b,0x3b3f46,0x23324a,0x4a3b2a,0x101010];
const HAIR=[0x1a120d,0x3b2414,0x0d0d0d,0x6b4a2b,0x24180f];
const pick=(r,a)=>a[Math.floor(r()*a.length)];
/* pose: 'sit'|'stand'; arms: 'rest'|'cheer'|'eat'|'drink'|'carry'|'play' */
function person(parent,pos,r,{pose='sit',arms='rest',rotY=0}={}){
  const skin=pick(r,SKIN), shirt=pick(r,SHIRT), pants=pick(r,PANTS);
  const root=J(parent,pos,[pose==='sit'?.1:0,rotY,0]);
  const hip=J(root,[0,0,0]);
  N(hip,'torso','tint',{c:shirt});
  Cy(hip,.15,.25,'tint',[0,1.9,0],[0,0,0],skin);
  const head=J(hip,[0,2.32,0]);
  Sp(head,.36,'tintMatte',[0,0,0],skin,[.34,.4,.36]);
  if(r()<.85) N(head,'hair','tintMatte',{p:[0,.04,.02],r:[-.25,0,0],s:[.37,.42,.38],c:pick(r,HAIR)});
  // legs
  [-1,1].forEach(sd=>{
    const th=J(hip,[sd*.23,.05,0],pose==='sit'?[Math.PI/2-.08,0,sd*.04]:[0,0,0]);
    N(th,'thigh','tint',{c:pants});
    const kn=J(th,[0,-1.48,0],pose==='sit'?[-Math.PI/2+.22,0,0]:[0,0,0]);
    N(kn,'shin','tint',{c:pants});
    Bx(kn,.28,.18,.56,'dark',[0,-1.42,-.14]);
  });
  // arms
  const A={rest:[[.3,0,.1],[1.15,0,0]],cheer:[[Math.PI-.25,0,.38],[.25,0,0]],eat:[[.55,0,.15],[2.45,0,0]],
           drink:[[.45,0,.12],[1.75,0,0]],carry:[[.15,0,.06],[1.45,0,0]],play:[[.35,0,.2],[1.4,0,-.25]]};
  [-1,1].forEach(sd=>{
    let k=arms;
    if((arms==='eat'||arms==='drink')&&sd<0) k='rest';
    const [ua,fa]=A[k];
    const sh=J(hip,[sd*.62,1.6,0],[ua[0],0,sd*ua[2]]);
    N(sh,'upperArm','tint',{c:shirt});
    const el=J(sh,[0,-.96,0],[fa[0],0,sd*fa[2]]);
    N(el,'foreArm','tintMatte',{c:skin});
    const hand=J(el,[0,-.95,0]);
    Sp(hand,.14,'tintMatte',[0,0,0],skin);
    if(sd>0&&arms==='drink'){Cy(hand,.13,.42,'red',[0,0,-.05],[0,0,0],null,'cyl8');}
    if(sd>0&&arms==='eat'){Bx(hand,.18,.12,.14,'gold',[0,.05,-.05]);}
  });
  if(arms==='carry'){ // tray of food held in front
    const t=J(root,[0,2.55,-1.15]);
    Bx(t,1.3,.08,.85,'tray',[0,0,0]);
    Bx(t,.5,.38,.4,'red',[-.28,.23,0]); Cy(t,.15,.5,'gold',[.32,.29,-.1]); Cy(t,.15,.5,'gold',[.32,.29,.18]);
  }
  if(pose==='sit'&&arms==='eat'){ Cy(root,.3,.45,'red',[.0,.55,-.95],[0,0,0],null); } // popcorn on lap
  if(pose==='stand'){ root.position.y+=1.48+1.42+.05; }
  return root;
}

  const piv=J(s,[0,1.32,.62],[occ?0:1.42,0,0]);              // fold-up cushion

  N(back,'seatBackPad','fabric',{p:[0,.04,-.16]});
  if(tray){ // clamped to the right armrest, swung in front of the seat
    const ax=1.0;
    Bx(s,.3,.24,.34,'trayArm',[ax,2.26,-.35]);
    Cy(s,.05,.62,'trayArm',[ax,2.62,-.35],[0,0,0],null,'cyl8');
    Bx(s,.62,.06,.09,'trayArm',[ax-.24,2.92,-.58],[0,.75,0]);

function armrest(g,x,h,z){

function seatRows(g,r,rows,{occ,trays,armsPick,laptops=0}){

function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

    c.fillStyle='#f7f1ec'; c.font=font(800,190,'d'); c.fillText('REYES',w*.28,262); c.fillText('OKAFOR',w*.72,262);

    c.font=font(700,56,'d'); c.fillText('ROUND 7 · 2:14',w/2,392);

/* ================= build a setup ================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= render on demand ================= */
let pending=false, anim=null;
function requestRender(){ if(!pending){ pending=true; requestAnimationFrame(frame); } }
function frame(now){
  pending=false;
  let more=false;
  if(anim){ anim(now); more=true; }
  if(controls.update()) more=true;
  renderer.render(scene,camera); placeLabels();
  if(more) requestRender();
}
controls.addEventListener('change',requestRender);
function resize(){const w=view.clientWidth,h=view.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); requestRender();}

function flyTo(C,ms=900,instant){
  const from={p:camera.position.clone(),t:controls.target.clone()}, to={p:new THREE.Vector3(...C.p),t:new THREE.Vector3(...C.t)};
  if(instant||window.matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(to.p);controls.target.copy(to.t);anim=null;controls.update();requestRender();return;}
  const t0=performance.now(); anim=now=>{const a=Math.min(1,(now-t0)/ms), e=a<.5?4*a*a*a:1-Math.pow(-2*a+2,3)/2; camera.position.lerpVectors(from.p,to.p,e); controls.target.lerpVectors(from.t,to.t,e); if(a>=1)anim=null;};
  requestRender();
}
function cam(k,instant){ camKey=k; flyTo(CAMS[k],900,instant); renderPanel(); }

const STEP_MS=6500;
let touring=false, tStep=0, tTimer=null, tPaused=false, tStart=0, tBarRaf=0;
function tourRender(){
  const T=TOUR[tStep];
  $('#tourcap').innerHTML=`<div class="k">${tStep+1} / ${TOUR.length} · ${T.k}</div><h2>${T.h}</h2><p>${T.x}</p><div class="bar"><i id="tbar"></i></div>

}
function tourGo(i){
  tStep=Math.max(0,Math.min(TOUR.length-1,i)); const T=TOUR[tStep];
  if(setup!==T.s) build(T.s);
  camKey=''; flyTo(T.c,1800); renderPanel(); tourRender();
  clearTimeout(tTimer); cancelAnimationFrame(tBarRaf);
  if(!tPaused){ tStart=performance.now(); tTimer=setTimeout(()=>{ tStep<TOUR.length-1?tourGo(tStep+1):tourEnd(); },STEP_MS); barTick(); }
}
function barTick(){ const b=document.getElementById('tbar'); if(b) b.style.width=Math.min(100,(performance.now()-tStart)/STEP_MS*100)+'%'; if(touring&&!tPaused) tBarRaf=requestAnimationFrame(barTick); }

/* ================= events ================= */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.tour){ tourStart(); return; }
  if(d.panel){ document.body.classList.toggle('closed',d.panel==='close'); requestAnimationFrame(resize); renderPanel(); return; }
  if(d.tc){ if(d.tc==='next') tStep<TOUR.length-1?tourGo(tStep+1):tourEnd(); else if(d.tc==='prev') tourGo(tStep-1); else if(d.tc==='exit') tourEnd(); else if(d.tc==='pause'){ tPaused=!tPaused; tourGo(tStep); } return; }
  if(d.setup){ if(touring) tourEnd(); build(d.setup); }
  if(d.cam){ if(touring) tourEnd(); cam(d.cam); }
  if(d.more){ showAll=!showAll; renderPanel(); }

});
